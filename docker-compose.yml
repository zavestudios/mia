services:
  autonomous-agent:
    build: .
    env_file:
      - .env
    ports:
      - "${OPENCLAW_PORT:-18789}:18789"
    volumes:
      - ./config:/home/node/.openclaw
      - autonomous_agent_data:/home/node/.openclaw/data
    environment:
      - NODE_ENV=${NODE_ENV:-development}

volumes:
  autonomous_agent_data:
